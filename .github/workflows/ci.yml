name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tanomu"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy
    env:
      IMAGE: tanomu-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # App config, written to /opt/tanomu/.env on every deploy.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CHAT_PROVIDER_PROTOCOL: ${{ vars.CHAT_PROVIDER_PROTOCOL }}
          CHAT_PROVIDER_BASE_URL: ${{ secrets.CHAT_PROVIDER_BASE_URL }}
          CHAT_PROVIDER_API_KEY: ${{ secrets.CHAT_PROVIDER_API_KEY }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
        shell: bash
        run: |
          remote() { ssh -i ~/.ssh/deploy_key "$TARGET" "$@"; }
          ship() { docker save "$1" | gzip | remote 'gunzip | docker load'; }

          app_vars="POSTGRES_PASSWORD FEISHU_APP_ID FEISHU_APP_SECRET CHAT_PROVIDER_PROTOCOL CHAT_PROVIDER_BASE_URL CHAT_PROVIDER_API_KEY CHAT_MODEL"
          for name in $app_vars; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in the production environment"; exit 1; fi
          done

          # The server can't reach Docker Hub, so every image comes from here over SSH.
          ship "$IMAGE"
          touch deploy/.env # compose config needs the env_file to exist; values don't matter here
          for image in $(TANOMU_IMAGE=self POSTGRES_PASSWORD=x docker compose -f deploy/compose.yml config --images | grep -vx self); do
            if ! remote docker image inspect "$image" > /dev/null 2>&1; then
              docker pull "$image"
              ship "$image"
            fi
          done

          scp -i ~/.ssh/deploy_key deploy/compose.yml deploy/backup.sh "$TARGET:/opt/tanomu/"
          {
            echo "TANOMU_IMAGE=$IMAGE"
            for name in $app_vars; do printf '%s=%s\n' "$name" "${!name}"; done
          } | remote 'umask 077 && cat > /opt/tanomu/.env.next && mv /opt/tanomu/.env.next /opt/tanomu/.env'

          remote bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/tanomu
          mkdir -p backups
          # Install the backup cron first so backups run even if this rollout fails.
          cron_line="30 3 * * * /opt/tanomu/backup.sh >> /opt/tanomu/backups/backup.log 2>&1 # tanomu-backup"
          (crontab -l 2>/dev/null | grep -v '# tanomu-backup'; echo "$cron_line") | crontab -
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose up -d --force-recreate server
          # Matches the startup log line in apps/server/src/main.ts.
          timeout 60 sh -c "until docker compose logs --since $started server | grep -q 'tanomu is listening'; do sleep 2; done" \
            || { docker compose logs --tail 50 server; exit 1; }
          # Keep a week of old images for rollback.
          docker image prune -af --filter until=168h
          REMOTE
