name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tanomu"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:factory
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:admin
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check PR size (max 600 changed lines, see AGENTS.md)
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use event SHAs: the synthetic merge commit can include newer base-branch changes.
          changed=$(git diff --numstat "$BASE"..."$PR_HEAD" -- . ':(exclude)pnpm-lock.yaml' ':(exclude)apps/server/drizzle/meta/**' \
            | awk '{ total += $1 + $2 } END { print total + 0 }')
          echo "Changed lines, excluding generated files: $changed"
          if [ "$changed" -gt 600 ]; then
            echo "::error::This PR changes $changed lines; keep PRs at or under 600 and split the rest into follow-ups (AGENTS.md)."
            exit 1
          fi

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          BUILD_PROXY: ${{ vars.BUILD_PROXY }}
          # App config, written to /opt/tanomu/.env on every deploy.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          CHAT_PROVIDER_PROTOCOL: ${{ vars.CHAT_PROVIDER_PROTOCOL }}
          CHAT_PROVIDER_BASE_URL: ${{ secrets.CHAT_PROVIDER_BASE_URL }}
          CHAT_PROVIDER_API_KEY: ${{ secrets.CHAT_PROVIDER_API_KEY }}
          CHAT_MODEL: ${{ vars.CHAT_MODEL }}
          CHAT_MODEL_VISION: ${{ vars.CHAT_MODEL_VISION }}
        shell: bash
        run: |
          remote() { ssh -i ~/.ssh/deploy_key "$TARGET" "$@"; }

          app_vars="POSTGRES_PASSWORD FEISHU_APP_ID FEISHU_APP_SECRET SESSION_SECRET MASTER_KEY CHAT_PROVIDER_PROTOCOL CHAT_PROVIDER_BASE_URL CHAT_PROVIDER_API_KEY CHAT_MODEL CHAT_MODEL_VISION"
          for name in $app_vars; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in the production environment"; exit 1; fi
          done

          # Only the source crosses the border (a few hundred KB); the server builds it (ADR 0006).
          git archive --format=tar.gz HEAD \
            | remote 'rm -rf /opt/tanomu/src.next && mkdir /opt/tanomu/src.next && tar -xz -C /opt/tanomu/src.next'
          scp -i ~/.ssh/deploy_key deploy/compose.yml deploy/backup.sh "$TARGET:/opt/tanomu/"
          {
            echo "TANOMU_IMAGE=tanomu-server:$GITHUB_SHA"
            echo "BUILD_PROXY=$BUILD_PROXY"
            for name in $app_vars; do printf '%s=%s\n' "$name" "${!name}"; done
          } | remote 'umask 077 && cat > /opt/tanomu/.env.next && mv /opt/tanomu/.env.next /opt/tanomu/.env'

          remote bash -s <<'REMOTE'
          set -euo pipefail
          trap 'echo "::error::remote deploy failed at line $LINENO: $BASH_COMMAND"' ERR
          cd /opt/tanomu
          mkdir -p backups
          # Install the backup cron first so backups run even if this rollout fails.
          cron_line="30 3 * * * /opt/tanomu/backup.sh >> /opt/tanomu/backups/backup.log 2>&1 # tanomu-backup"
          { crontab -l 2>/dev/null | grep -v '# tanomu-backup' || true; echo "$cron_line"; } | crontab -
          rm -rf src && mv src.next src
          # A failed build stops here and leaves the running container untouched. The client side of
          # the build fetches registry tokens itself, so it needs the proxy too, not just the daemon.
          BUILD_PROXY=$(sed -n 's/^BUILD_PROXY=//p' .env)
          HTTP_PROXY=$BUILD_PROXY HTTPS_PROXY=$BUILD_PROXY NO_PROXY=localhost,127.0.0.1 docker compose build server
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose up -d --force-recreate server
          # Matches the startup log line in apps/server/src/main.ts.
          timeout 60 sh -c "until docker compose logs --since $started server | grep -q 'tanomu is listening'; do sleep 2; done" \
            || { docker compose logs --tail 50 server; exit 1; }
          # Keep a week of old images (for rollback) and build cache.
          docker image prune -af --filter until=168h
          docker builder prune -f --filter until=168h
          REMOTE
