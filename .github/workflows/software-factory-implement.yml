name: Software factory implement
run-name: "Factory issue #${{ github.event.issue.number || inputs.issue_number }} · attempt ${{ github.run_attempt }}"
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved issue number
        required: true
        type: string
permissions: {}
concurrency:
  group: factory-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name != 'issues' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      reason: ${{ steps.validation.outputs.reason }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate explicit maintainer authorization
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issues ] && [ "$LABEL_NAME" != 'agent:implement' ]; then
            echo '::notice::Ignoring unrelated issue label'
            exit 0
          fi
          python3 -I .github/software-factory/control.py gate-attempt "$ISSUE" "$RUNNER_TEMP/input"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-input
          path: ${{ runner.temp }}/input
          retention-days: 3
          if-no-files-found: error
  gate-feedback:
    needs: gate
    if: >-
      always() && needs.gate.result != 'skipped' && github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner && github.triggering_actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Explain rejected gate without claiming the task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          RESULT: ${{ needs.gate.result }}
          REASON: ${{ needs.gate.outputs.reason }}
        run: python3 -I .github/software-factory/control.py gate-feedback "$ISSUE" "$RESULT" "$REASON"
  claim:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: ${{ runner.temp }}/input
      - name: Revalidate before claiming
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: python3 -I .github/software-factory/control.py revalidate "$ISSUE" "$RUNNER_TEMP/input"
      - name: Consume authorization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE" --add-label implementing --remove-label agent:implement
          python3 -I .github/software-factory/control.py record-claim "$ISSUE" "$RUNNER_TEMP/input" "$RUNNER_TEMP/claim.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-claim
          path: ${{ runner.temp }}/claim.json
          retention-days: 3
          if-no-files-found: error
  # Check failures and review findings share one budget: the first attempt plus two repairs.
  round1:
    needs: claim
    uses: ./.github/workflows/software-factory-round.yml
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
    permissions:
      contents: read
    with:
      issue: ${{ github.event.issue.number || inputs.issue_number }}
      round: 1
      base: ${{ github.sha }}
  round2:
    needs: round1
    if: needs.round1.outputs.outcome == 'checks_failed' || needs.round1.outputs.outcome == 'request_changes'
    uses: ./.github/workflows/software-factory-round.yml
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
    permissions:
      contents: read
    with:
      issue: ${{ github.event.issue.number || inputs.issue_number }}
      round: 2
      base: ${{ github.sha }}
  round3:
    needs: round2
    if: needs.round2.outputs.outcome == 'checks_failed' || needs.round2.outputs.outcome == 'request_changes'
    uses: ./.github/workflows/software-factory-round.yml
    secrets:
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
    permissions:
      contents: read
    with:
      issue: ${{ github.event.issue.number || inputs.issue_number }}
      round: 3
      base: ${{ github.sha }}
  handoff:
    needs: [round1, round2, round3]
    # Rounds stop at the first approval, so at most one round approves and none may have failed.
    if: >-
      always() && !cancelled() && contains(needs.*.outputs.outcome, 'approve') &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: ${{ runner.temp }}/input
      - id: approved
        env:
          ROUND1: ${{ needs.round1.outputs.outcome }}
          ROUND2: ${{ needs.round2.outputs.outcome }}
          ROUND3: ${{ needs.round3.outputs.outcome }}
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            outcome="ROUND$round"
            if [ "${!outcome}" = approve ]; then printf 'round=%s\n' "$round" >> "$GITHUB_OUTPUT"; fi
          done
      # Publish exactly the formatted patch that passed the checks and review.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-${{ steps.approved.outputs.round }}
          path: ${{ runner.temp }}/patch
      - name: Validate and commit candidate
        working-directory: candidate
        env:
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          BASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/patch/candidate.patch"
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          python3 -I ../trusted/.github/software-factory/control.py scan-public "$RUNNER_TEMP/patch/candidate.patch"
          branch=$(jq -r .branch "$RUNNER_TEMP/input/input.json")
          title=$(jq -r .title "$RUNNER_TEMP/input/input.json")
          git switch -c "$branch"
          git add .
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$title" -m "Refs #$ISSUE" \
            -m 'Co-Authored-By: Claude Code <noreply@anthropic.com>'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-claim
          path: ${{ runner.temp }}/claim
      - name: Push and open draft PR
        id: pr
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          ROUND: ${{ steps.approved.outputs.round }}
        run: |
          set -euo pipefail
          python3 -I ../trusted/.github/software-factory/control.py claimed "$ISSUE" "$RUNNER_TEMP/input" "$RUNNER_TEMP/claim/claim.json"
          gh auth setup-git
          branch=$(git branch --show-current)
          git push --force-with-lease="refs/heads/$branch:" origin "HEAD:refs/heads/$branch"
          title=$(jq -r .title "$RUNNER_TEMP/input/input.json")
          python3 -I ../trusted/.github/software-factory/control.py pr-body "$ISSUE" "$ROUND" "$RUNNER_TEMP/pr.md"
          url=$(gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr.md" | tail -n 1)
          printf 'pr=%s\n' "${url##*/}" >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN PR fires no pull_request event. The review is advisory, so failing to
      # start it leaves the handoff successful.
      - name: Start final review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo '::warning::invalid-pr-number'; exit 1; }
          gh workflow run final-review.yml --ref main -f pr="$PR" -f parent="$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
  publish-reviews:
    needs: [claim, round1, round2, round3, handoff]
    if: always() && !cancelled() && needs.claim.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: feedback-*
          path: ${{ runner.temp }}/reports
      - name: Comment on the PR or issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          python3 -I .github/software-factory/control.py comments "$RUNNER_TEMP/reports" "$RUNNER_TEMP/comments"
          shopt -s nullglob
          files=("$RUNNER_TEMP/comments/"*.md)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          branch="feat/$ISSUE-implement"
          pr=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          for file in "${files[@]}"; do
            if [ -n "$pr" ]; then
              gh pr comment "$pr" --body-file "$file"
            else
              gh issue comment "$ISSUE" --body-file "$file"
            fi
          done
  report:
    needs: [gate, claim, round1, round2, round3, handoff]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: round-status-*
          path: ${{ runner.temp }}/status
      - name: Publish fixed status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          OUTCOMES: ${{ toJSON(needs) }}
        run: python3 -I .github/software-factory/control.py terminal-report "$ISSUE" "$RUNNER_TEMP/status"
