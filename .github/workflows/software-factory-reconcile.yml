name: Software factory reconciliation
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: factory-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reconcile metadata without authorizing execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I .github/software-factory/reconcile.py >> "$GITHUB_STEP_SUMMARY"
