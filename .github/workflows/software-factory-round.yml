name: Software factory round
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      model:
        required: true
        type: string
      round:
        required: true
        type: number
      base:
        required: true
        type: string
    secrets:
      OPENCODE_AUTH_JSON:
        required: true
    outputs:
      outcome:
        description: checks_failed, request_changes or approve; empty when the round failed
        value: ${{ jobs.verify.outputs.checks == 'failed' && 'checks_failed' || jobs.review.outputs.verdict }}
permissions: {}
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: candidate/.factory-input
      - id: previous
        if: inputs.round > 1
        env:
          ROUND: ${{ inputs.round }}
        run: printf 'round=%s\n' "$((ROUND - 1))" >> "$GITHUB_OUTPUT"
      # Repairs continue from the formatted candidate that was actually checked.
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-${{ steps.previous.outputs.round }}
          path: previous
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feedback-${{ steps.previous.outputs.round }}
          path: candidate/.factory-input
      - name: Prepare candidate
        working-directory: candidate
        env:
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          printf '.factory-input/\n' >> .git/info/exclude
          if [ "$ROUND" -gt 1 ]; then git apply ../previous/candidate.patch; fi
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure isolated runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          FACTORY_WORKSPACE: ${{ github.workspace }}/candidate
          FACTORY_ISSUE: ${{ inputs.issue }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" implement
      - name: Generate bounded candidate
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          prompt=$(python3 -I ../trusted/.github/software-factory/control.py prompt implement "$ISSUE")
          # Raw events and stderr stay on the runner; only the allowlisted summary is printed.
          started=$(date +%s)
          status=0
          timeout --kill-after=15 600 opencode run --standalone --format json -m "$MODEL" "$prompt" \
            > "$RUNNER_TEMP/implementation.jsonl" 2> "$RUNNER_TEMP/implementation.stderr" || status=$?
          python3 -I ../trusted/.github/software-factory/control.py summary "$RUNNER_TEMP/implementation.jsonl" \
            "$status" "$(($(date +%s) - started))" "$started" || echo '::warning::opencode-summary-failed'
          if [ "$status" -ne 0 ]; then
            echo "::error::opencode-exit-$status"
            exit "$status"
          fi
          python3 -I ../trusted/.github/software-factory/control.py events "$RUNNER_TEMP/implementation.jsonl"
      - name: Validate and export patch
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          mkdir ../output
          git diff --binary "$BASE" > ../output/candidate.patch
          python3 -I ../trusted/.github/software-factory/control.py scan ../output/candidate.patch
          if [ "$ROUND" -gt 1 ] && cmp -s ../output/candidate.patch ../previous/candidate.patch; then
            echo '::error::unchanged-candidate'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: output/candidate.patch
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        # Unlike the implicit default, an explicit bash shell sets pipefail for `| tee`.
        shell: bash
    outputs:
      # Derived from step outcomes, which candidate code cannot rewrite.
      checks: ${{ steps.test.outcome == 'success' && 'passed' || 'failed' }}
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tanomu" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: ${{ runner.temp }}/patch
      - name: Apply candidate
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/patch/candidate.patch"
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: candidate
      # Formatting is mechanical, so the orchestrator applies it instead of spending a repair round.
      - id: format
        continue-on-error: true
        working-directory: candidate
        run: pnpm format 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Export checked candidate
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          mkdir ../checked
          git diff --binary "$BASE" > ../checked/candidate.patch
          python3 -I ../trusted/.github/software-factory/control.py scan-public ../checked/candidate.patch
      # Upload before any candidate code executes, so the published patch is the checked one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-${{ inputs.round }}
          path: checked/candidate.patch
          retention-days: 3
          if-no-files-found: error
      - id: lint
        if: steps.format.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: typecheck
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm build:admin 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        env:
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Summarize failed check
        if: steps.test.outcome != 'success'
        env:
          FAILED: >-
            ${{ steps.format.outcome == 'failure' && 'pnpm format' ||
                steps.lint.outcome == 'failure' && 'pnpm lint' ||
                steps.typecheck.outcome == 'failure' && 'pnpm typecheck' ||
                steps.build.outcome == 'failure' && 'pnpm build:admin' || 'pnpm test' }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/feedback"
          python3 -I trusted/.github/software-factory/control.py diagnose \
            "$RUNNER_TEMP/feedback/checks.json" "$FAILED" "$RUNNER_TEMP/checks.log"
          python3 -I trusted/.github/software-factory/control.py scan-public "$RUNNER_TEMP/feedback/checks.json"
      - if: steps.test.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedback-${{ inputs.round }}
          path: ${{ runner.temp }}/feedback/checks.json
          retention-days: 3
          if-no-files-found: error
  review:
    needs: verify
    if: needs.verify.outputs.checks == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: candidate/.factory-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-${{ inputs.round }}
          path: candidate/.factory-input
      - name: Apply candidate for independent review
        working-directory: candidate
        run: git apply .factory-input/candidate.patch
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure fresh read-only runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" review
      - name: Independently review verified candidate
        id: review
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
          ISSUE: ${{ inputs.issue }}
          REVIEW_OUTPUT: ${{ runner.temp }}/feedback/review.json
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          mkdir "$RUNNER_TEMP/feedback"
          prompt=$(python3 -I ../trusted/.github/software-factory/control.py prompt review "$ISSUE")
          started=$(date +%s)
          status=0
          timeout --kill-after=15 600 opencode run --standalone --format json -m "$MODEL" "$prompt" \
            > "$RUNNER_TEMP/review.jsonl" 2> "$RUNNER_TEMP/review.stderr" || status=$?
          python3 -I ../trusted/.github/software-factory/control.py summary "$RUNNER_TEMP/review.jsonl" \
            "$status" "$(($(date +%s) - started))" "$started" || echo '::warning::opencode-summary-failed'
          if [ "$status" -ne 0 ]; then
            echo "::error::opencode-exit-$status"
            exit "$status"
          fi
          verdict=$(python3 -I ../trusted/.github/software-factory/control.py review "$RUNNER_TEMP/review.jsonl")
          python3 -I ../trusted/.github/software-factory/control.py scan "$REVIEW_OUTPUT"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedback-${{ inputs.round }}
          path: ${{ runner.temp }}/feedback/review.json
          retention-days: 3
          if-no-files-found: error
