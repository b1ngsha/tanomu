name: Software factory round
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      model:
        required: true
        type: string
      round:
        required: true
        type: number
      base:
        required: true
        type: string
    secrets:
      OPENCODE_AUTH_JSON:
        required: true
    outputs:
      verdict:
        value: ${{ jobs.review.outputs.verdict }}
permissions: {}
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: candidate/.factory-input
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ inputs.round == 2 && '1' || '2' }}
          path: previous
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-${{ inputs.round == 2 && '1' || '2' }}
          path: candidate/.factory-input
      - name: Prepare candidate
        working-directory: candidate
        env:
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          printf '.factory-input/\n' >> .git/info/exclude
          if [ "$ROUND" -gt 1 ]; then git apply ../previous/candidate.patch; fi
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure isolated runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          FACTORY_WORKSPACE: ${{ github.workspace }}/candidate
          FACTORY_ISSUE: ${{ inputs.issue }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" implement
      - name: Generate bounded candidate
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          timeout 600 opencode run --standalone --format json -m "$MODEL" \
            "$(cat ../trusted/.github/software-factory/prompts/implement.md)" \
            > "$RUNNER_TEMP/implementation.jsonl" 2> "$RUNNER_TEMP/implementation.stderr"
      - name: Validate and export patch
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          mkdir ../output
          git diff --binary "$BASE" > ../output/candidate.patch
          python3 -I ../trusted/.github/software-factory/control.py scan ../output/candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: output/candidate.patch
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tanomu" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: ${{ runner.temp }}/patch
      - name: Apply candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/patch/candidate.patch"
          git add -N .
          python3 -I .github/software-factory/control.py scope "$ISSUE" "$BASE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:admin
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu
  review:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: candidate/.factory-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: candidate/.factory-input
      - name: Apply candidate for independent review
        working-directory: candidate
        run: git apply .factory-input/candidate.patch
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure fresh read-only runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" review
      - name: Independently review verified candidate
        id: review
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
          REVIEW_OUTPUT: ${{ runner.temp }}/feedback.json
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          timeout 600 opencode run --standalone --format json -m "$MODEL" \
            "$(cat ../trusted/.github/software-factory/prompts/review.md)" \
            > "$RUNNER_TEMP/review.jsonl" 2> "$RUNNER_TEMP/review.stderr"
          verdict=$(python3 -I ../trusted/.github/software-factory/control.py review "$RUNNER_TEMP/review.jsonl")
          python3 -I ../trusted/.github/software-factory/control.py scan "$REVIEW_OUTPUT"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-${{ inputs.round }}
          path: ${{ runner.temp }}/feedback.json
          retention-days: 3
          if-no-files-found: error
