name: Software factory round
on:
  workflow_call:
    inputs:
      issue:
        required: true
        type: string
      model:
        required: true
        type: string
      round:
        required: true
        type: number
      base:
        required: true
        type: string
    secrets:
      OPENCODE_AUTH_JSON:
        required: true
    outputs:
      outcome:
        description: checks_failed, request_changes or approve; empty when the round failed
        value: ${{ jobs.verify.outputs.checks == 'failed' && 'checks_failed' || jobs.review.outputs.verdict }}
permissions: {}
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tanomu" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: ${{ runner.temp }}/input
      - id: previous
        if: inputs.round > 1
        env:
          ROUND: ${{ inputs.round }}
        run: printf 'round=%s\n' "$((ROUND - 1))" >> "$GITHUB_OUTPUT"
      # Repairs continue from the formatted candidate that was actually checked.
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-${{ steps.previous.outputs.round }}
          path: previous
      - if: inputs.round > 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: feedback-${{ steps.previous.outputs.round }}
          path: ${{ runner.temp }}/feedback
      - name: Prepare candidate
        working-directory: candidate
        env:
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          printf '.factory-input/\n' >> .git/info/exclude
          if [ "$ROUND" -gt 1 ]; then git apply ../previous/candidate.patch; fi
      # Install candidate dependencies without lifecycle scripts; checks run on disposable runners.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: candidate
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure isolated runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          FACTORY_WORKSPACE: ${{ github.workspace }}/candidate
          FACTORY_ISSUE: ${{ inputs.issue }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" implement
      - name: Generate bounded candidate
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
          ISSUE: ${{ inputs.issue }}
          ROUND: ${{ inputs.round }}
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          rm -rf .factory-input
          cp -R "$RUNNER_TEMP/input" .factory-input
          if [ "$ROUND" -gt 1 ]; then cp "$RUNNER_TEMP/feedback/"* .factory-input/; fi
          prompt=$(python3 -I ../trusted/.github/software-factory/control.py prompt implement "$ISSUE")
          # Events go to a transcript artifact for retro; the log gets only the allowlisted summary.
          started=$(date +%s)
          status=0
          timeout --kill-after=15 1500 opencode run --standalone --format json -m "$MODEL" "$prompt" \
            > "$RUNNER_TEMP/implementation.jsonl" 2> "$RUNNER_TEMP/implementation.stderr" || status=$?
          python3 -I ../trusted/.github/software-factory/control.py summary "$RUNNER_TEMP/implementation.jsonl" \
            "$status" "$(($(date +%s) - started))" "$started" | tee "$RUNNER_TEMP/implementation-summary.txt" || echo '::warning::opencode-summary-failed'
          if [ "$status" -ne 0 ]; then
            echo "::error::opencode-exit-$status"
            exit "$status"
          fi
          python3 -I ../trusted/.github/software-factory/control.py events "$RUNNER_TEMP/implementation.jsonl"
      # Recorded even when the run fails or times out: those sessions teach retro the most.
      - name: Record session
        id: session
        if: always()
        continue-on-error: true
        env:
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/session"
          python3 -I trusted/.github/software-factory/control.py transcript \
            "$RUNNER_TEMP/implementation.jsonl" "$RUNNER_TEMP/session/round$ROUND-implement.md"
          if [ -f "$RUNNER_TEMP/implementation-summary.txt" ]; then
            python3 -I trusted/.github/software-factory/control.py scan-session "$RUNNER_TEMP/implementation-summary.txt"
            cp "$RUNNER_TEMP/implementation-summary.txt" "$RUNNER_TEMP/session/round$ROUND-implement-summary.txt"
          fi
          python3 -I trusted/.github/software-factory/control.py scan-session \
            "$RUNNER_TEMP/session/round$ROUND-implement.md"
      - if: always() && steps.session.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-implement-${{ inputs.round }}
          # Only the files just scanned: the model's shell could have left others here.
          path: |
            ${{ runner.temp }}/session/round${{ inputs.round }}-implement.md
            ${{ runner.temp }}/session/round${{ inputs.round }}-implement-summary.txt
          retention-days: 3
          if-no-files-found: error
      # A best-effort early stop: after shell access nothing on this runner is trusted, so verify
      # repeats the scope check on a fresh runner.
      - name: Validate and export patch
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          mkdir ../output
          git diff --binary "$BASE" > ../output/candidate.patch
          python3 -I ../trusted/.github/software-factory/control.py scan ../output/candidate.patch
          if [ "$ROUND" -gt 1 ] && cmp -s ../output/candidate.patch ../previous/candidate.patch; then
            echo '::error::unchanged-candidate'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: output/candidate.patch
          retention-days: 3
          if-no-files-found: error
  verify:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        # Unlike the implicit default, an explicit bash shell sets pipefail for `| tee`.
        shell: bash
    outputs:
      # Derived from step outcomes, which candidate code cannot rewrite.
      checks: ${{ steps.test.outcome == 'success' && 'passed' || 'failed' }}
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: tanomu
          POSTGRES_PASSWORD: tanomu
          POSTGRES_DB: tanomu
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tanomu" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ inputs.round }}
          path: ${{ runner.temp }}/patch
      - name: Apply candidate
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/patch/candidate.patch"
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: candidate/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: candidate
      # Formatting is mechanical, so the orchestrator applies it instead of spending a repair round.
      - id: format
        continue-on-error: true
        working-directory: candidate
        run: pnpm format 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Export checked candidate
        working-directory: candidate
        env:
          ISSUE: ${{ inputs.issue }}
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git add -N .
          python3 -I ../trusted/.github/software-factory/control.py scope "$ISSUE" "$BASE"
          mkdir ../checked
          git diff --binary "$BASE" > ../checked/candidate.patch
          python3 -I ../trusted/.github/software-factory/control.py scan-public ../checked/candidate.patch
      # Factory orchestration stays trusted; candidate scripts/tests run only on this disposable runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-${{ inputs.round }}
          path: checked/candidate.patch
          retention-days: 3
          if-no-files-found: error
      - id: lint
        if: steps.format.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: typecheck
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        run: pnpm build:admin 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: candidate
        env:
          TEST_DATABASE_URL: postgres://tanomu:tanomu@localhost:5432/tanomu
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/checks.log"
      - name: Summarize failed check
        if: steps.test.outcome != 'success'
        env:
          FAILED: >-
            ${{ steps.format.outcome == 'failure' && 'pnpm format' ||
                steps.lint.outcome == 'failure' && 'pnpm lint' ||
                steps.typecheck.outcome == 'failure' && 'pnpm typecheck' ||
                steps.build.outcome == 'failure' && 'pnpm build:admin' || 'pnpm test' }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/feedback"
          python3 -I trusted/.github/software-factory/control.py diagnose \
            "$RUNNER_TEMP/feedback/checks.json" "$FAILED" "$RUNNER_TEMP/checks.log"
          python3 -I trusted/.github/software-factory/control.py scan-public "$RUNNER_TEMP/feedback/checks.json"
      - if: steps.test.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedback-${{ inputs.round }}
          path: ${{ runner.temp }}/feedback/checks.json
          retention-days: 3
          if-no-files-found: error
  review:
    needs: verify
    if: needs.verify.outputs.checks == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-input
          path: ${{ runner.temp }}/input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-${{ inputs.round }}
          path: ${{ runner.temp }}/checked
      - name: Apply candidate for independent review
        working-directory: candidate
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/checked/candidate.patch"
          rm -rf .factory-input
          cp -R "$RUNNER_TEMP/input" .factory-input
          cp "$RUNNER_TEMP/checked/candidate.patch" .factory-input/
      - name: Install pinned runner
        run: npm install --global @opencode/cli@2.1.0 --no-audit --no-fund && opencode --version | grep -Fx 'opencode v2.1.0'
      - name: Configure fresh read-only runner
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: python3 -I trusted/.github/software-factory/control.py configure "$RUNNER_TEMP/model" review
      - name: Independently review verified candidate
        id: review
        working-directory: candidate
        env:
          MODEL: ${{ inputs.model }}
          ISSUE: ${{ inputs.issue }}
          REVIEW_OUTPUT: ${{ runner.temp }}/feedback/review.json
        run: |
          set -euo pipefail
          test "$MODEL" = opencode/deepseek-v4.1-flash-free
          PWD=$(pwd -P)
          export PWD
          mkdir "$RUNNER_TEMP/feedback"
          # Each invocation starts a fresh session; neither axis sees the other's conversation.
          for axis in standards spec; do
            prompt=$(python3 -I ../trusted/.github/software-factory/control.py prompt "review-$axis" "$ISSUE")
            started=$(date +%s)
            status=0
            timeout --kill-after=15 600 opencode run --standalone --format json -m "$MODEL" "$prompt" \
              > "$RUNNER_TEMP/review-$axis.jsonl" 2> "$RUNNER_TEMP/review-$axis.stderr" || status=$?
            python3 -I ../trusted/.github/software-factory/control.py summary "$RUNNER_TEMP/review-$axis.jsonl" \
              "$status" "$(($(date +%s) - started))" "$started" | tee "$RUNNER_TEMP/review-$axis-summary.txt" || echo '::warning::opencode-summary-failed'
            if [ "$status" -ne 0 ]; then
              echo "::error::opencode-exit-$status"
              exit "$status"
            fi
          done
          verdict=$(python3 -I ../trusted/.github/software-factory/control.py review \
            "$RUNNER_TEMP/review-standards.jsonl" "$RUNNER_TEMP/review-spec.jsonl")
          python3 -I ../trusted/.github/software-factory/control.py scan-output "$REVIEW_OUTPUT"
          python3 -I ../trusted/.github/software-factory/control.py scan-output "$RUNNER_TEMP/feedback/review.md"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
      - name: Record sessions
        id: session
        if: always()
        continue-on-error: true
        env:
          ROUND: ${{ inputs.round }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/session"
          for axis in standards spec; do
            python3 -I trusted/.github/software-factory/control.py transcript \
              "$RUNNER_TEMP/review-$axis.jsonl" "$RUNNER_TEMP/session/round$ROUND-review-$axis.md"
            if [ -f "$RUNNER_TEMP/review-$axis-summary.txt" ]; then
              python3 -I trusted/.github/software-factory/control.py scan-session "$RUNNER_TEMP/review-$axis-summary.txt"
              cp "$RUNNER_TEMP/review-$axis-summary.txt" "$RUNNER_TEMP/session/round$ROUND-review-$axis-summary.txt"
            fi
            python3 -I trusted/.github/software-factory/control.py scan-session \
              "$RUNNER_TEMP/session/round$ROUND-review-$axis.md"
          done
      - if: always() && steps.session.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-review-${{ inputs.round }}
          path: |
            ${{ runner.temp }}/session/round${{ inputs.round }}-review-standards.md
            ${{ runner.temp }}/session/round${{ inputs.round }}-review-standards-summary.txt
            ${{ runner.temp }}/session/round${{ inputs.round }}-review-spec.md
            ${{ runner.temp }}/session/round${{ inputs.round }}-review-spec-summary.txt
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedback-${{ inputs.round }}
          path: ${{ runner.temp }}/feedback
          retention-days: 3
          if-no-files-found: error
