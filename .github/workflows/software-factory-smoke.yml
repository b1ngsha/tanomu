name: Software factory smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenCode model ID (for example opencode/deepseek-v4.1-flash-free)
        required: true
        type: string

permissions: {}

concurrency:
  group: software-factory-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Read-only OpenCode smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Only the pinned supervisor/control helpers are checked out, outside the fixture.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: .github/software-factory
          persist-credentials: false
      - name: Reject unexpected event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch

      - name: Validate model input
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          [[ "$MODEL" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo '::error::model must be a simple OpenCode model identifier'
            exit 1
          }

      - name: Require isolated OpenCode credentials
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          test -n "$OPENCODE_AUTH_JSON" || {
            echo '::error::OPENCODE_AUTH_JSON is not configured; no model call will run'
            exit 1
          }
          jq -e 'type == "object"' <<<"$OPENCODE_AUTH_JSON" >/dev/null || {
            echo '::error::OPENCODE_AUTH_JSON is not valid JSON'
            exit 1
          }

      - name: Create disposable redacted fixture
        id: fixture
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          printf 'FIXTURE_DIR=%s\n' "$fixture_dir" >> "$GITHUB_OUTPUT"
          cat > "$fixture_dir/README.md" <<'EOF'
          This is a disposable synthetic fixture. Determine whether this file is a TypeScript project. Do not edit files, run commands, access the network, or share the session. Reply with exactly one short sentence.
          EOF
          printf '%s\n' 'before' > "$fixture_dir/.status"

      - name: Install pinned OpenCode CLI
        run: |
          set -euo pipefail
          npm install --global @opencode/cli@2.1.0 --no-audit --no-fund
          opencode --version | grep -Fx 'opencode v2.1.0'

      - name: Configure read-only OpenCode
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
          FIXTURE_DIR: ${{ steps.fixture.outputs.FIXTURE_DIR }}
        run: |
          set -euo pipefail
          auth_dir="$HOME/.local/share/opencode"
          install -m 700 -d "$auth_dir"
          umask 077
          printf '%s' "$OPENCODE_AUTH_JSON" > "$auth_dir/auth.json"
          cat > "$FIXTURE_DIR/opencode.json" <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "share": false,
            "permission": {
              "*": "deny",
              "read": "allow",
              "glob": "allow",
              "grep": "allow"
            }
          }
          JSON

      - name: Run read-only OpenCode smoke
        id: opencode
        working-directory: ${{ steps.fixture.outputs.FIXTURE_DIR }}
        env:
          MODEL: ${{ inputs.model }}
          OPENCODE_CONFIG: ${{ steps.fixture.outputs.FIXTURE_DIR }}/opencode.json
        run: |
          set -euo pipefail
          output_file="$RUNNER_TEMP/opencode-smoke.jsonl"
          started=$(date +%s)
          set +e
          python3 -I "$GITHUB_WORKSPACE/trusted/.github/software-factory/supervisor.py" \
            "$output_file" "$RUNNER_TEMP/smoke-summary.txt" smoke 420 -- \
            opencode run --standalone --format json -m "$MODEL" \
            'Read README.md only. Do not edit files, run commands, access the network, or share the session. Reply with exactly one short sentence.'
          status=$?
          set -e
          finished=$(date +%s)
          duration=$((finished - started))
          printf 'duration=%s\nexit_status=%s\n' "$duration" "$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            echo '::error::OpenCode smoke failed; inspect the redacted summary and runner log'
            exit "$status"
          fi
          test -s "$output_file" || {
            echo '::error::OpenCode returned no output'
            exit 1
          }
          test "$(cat .status)" = before || {
            echo '::error::read-only smoke modified the fixture'
            exit 1
          }
          if grep -Eiq '(^|[^[:alnum:]_])(api[_ -]?key|authorization|bearer|token|secret)([^[:alnum:]_]|$)' \
            "$output_file" "$RUNNER_TEMP/opencode-smoke.stderr"; then
            echo '::error::OpenCode output contained credential-shaped text'
            exit 1
          fi
          jq -e -s '
            all(.[]; type == "object") and
            all(.[]; .type != "error" and .error == null) and
            any(.[];
              .type == "text" and
              (.part.text | type == "string") and
              (.part.text | test("\\S"))
            )
          ' "$output_file" >/dev/null 2>&1 || {
            echo '::error::OpenCode must return valid JSON events with a non-empty reply and no errors'
            exit 1
          }

      - name: Write redacted summary
        if: always()
        env:
          MODEL: ${{ inputs.model }}
          OPENCODE_STATUS: ${{ steps.opencode.outcome }}
          OPENCODE_DURATION: ${{ steps.opencode.outputs.duration }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' '## Software factory smoke'
            printf '%s\n' '' '- Fixture: disposable redacted read-only fixture'
            printf '%s\n' "- Model ID: \`$MODEL\`"
            printf '%s\n' "- OpenCode smoke: \`$OPENCODE_STATUS\`"
            printf '%s\n' "- OpenCode duration (seconds): \`${OPENCODE_DURATION:-not recorded}\`"
            printf '%s\n' '' '- Only trusted orchestration helpers were checked out; the model ran in a disposable fixture. No production environment, issue, pull request, branch, or deployment access was used.'
          } >> "$GITHUB_STEP_SUMMARY"
