# Production stack. Lives at /opt/tanomu/compose.yml on the server; copied there by the deploy job.
# /opt/tanomu/.env is written by the deploy job from the GitHub `production` environment; it
# feeds both interpolation (POSTGRES_PASSWORD, TANOMU_IMAGE) and the app's env.
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: tanomu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tanomu
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanomu"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: ${TANOMU_IMAGE:?set by the deploy job}
    env_file: .env
    environment:
      DATABASE_URL: postgres://tanomu:${POSTGRES_PASSWORD}@db:5432/tanomu
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
